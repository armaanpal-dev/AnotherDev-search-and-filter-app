# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
# client_id is managed by the Shopify CLI — do not change it.
client_id = "2bd4c8dfc90eafb9c76f96a56733c2cf"
name = "Another Dev Search and Filter"
handle = "anotherdev-search"
application_url = "https://search.anotherdev.in"
embedded = true

[access_scopes]
# Read-only over the catalog: we mirror it into our own index and never write to
# it. `write_pixels` + `read_customer_events` are the two exceptions, and they
# buy exactly one thing: the Web Pixel that reports a completed order back to the
# search that produced it. Checkout runs on Shopify's domain, so there is no
# other way to measure search-driven revenue. The pixel reads no customer data —
# see extensions/anotherdev-pixel/src/index.js.
scopes = "read_products,read_product_listings,read_collection_listings,read_inventory,read_content,write_pixels,read_customer_events"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://search.anotherdev.in/auth/callback" ]

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Keeps Shop.planName honest between admin visits, so storefront Pro gating
  # reacts to a cancelled or upgraded subscription immediately.
  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/webhooks/app/subscriptions_update"

  [[webhooks.subscriptions]]
  topics = [ "products/create" ]
  uri = "/webhooks/products/upsert"

  [[webhooks.subscriptions]]
  topics = [ "products/update" ]
  uri = "/webhooks/products/upsert"

  [[webhooks.subscriptions]]
  topics = [ "products/delete" ]
  uri = "/webhooks/products/delete"

  # Collection topics get their own handler: the product handler ignored them,
  # so membership changes never reached the index.
  [[webhooks.subscriptions]]
  topics = [ "collections/create", "collections/update" ]
  uri = "/webhooks/collections/upsert"

  [[webhooks.subscriptions]]
  topics = [ "collections/delete" ]
  uri = "/webhooks/collections/delete"

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

# Storefront search API served through an App Proxy on the merchant's own domain.
[app_proxy]
url = "https://search.anotherdev.in/proxy"
subpath = "anotherdev-search"
prefix = "apps"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = false
