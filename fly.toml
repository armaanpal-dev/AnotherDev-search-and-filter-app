# Fly.io config for AnotherDev Search & Filters.
# Change `app` to a globally-unique name if this one is taken.
app = "anotherdev-search"
primary_region = "sin"  # Singapore — close to the Supabase ap-southeast-1 DB

[build]

# Run DB migrations once per deploy (not on every restart).
#
# `db:index` is NOT optional and must run here too. The tsvector column, the
# trigram indexes and the pgvector column live in prisma/sql/search_index.sql,
# which Prisma cannot model and therefore does not apply. Deploying to a fresh
# database with only `migrate deploy` left `Product."searchVector"` missing, so
# every storefront search returned a 500. The script is idempotent by design and
# the generated column is only rebuilt when its definition is actually stale, so
# running it on every deploy is cheap.
[deploy]
  release_command = "sh -c 'npx prisma migrate deploy && npm run db:index'"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  SEARCH_BACKEND = "postgres"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Keep one machine always running so storefront search never cold-starts.
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
