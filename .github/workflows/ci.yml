name: CI

on:
  push:
    branches: [main]
  pull_request:

# The integration and edge-case suites run the REAL engine against a real
# Postgres with pg_trgm/unaccent, because that is where the behaviour actually
# lives — the SQL, not the TypeScript around it. A mocked database would pass
# while shipping a broken tsquery.
jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anotherdev_search_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/anotherdev_search_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/anotherdev_search_test?schema=public
      SHOPIFY_API_KEY: test
      SHOPIFY_API_SECRET: test
      SHOPIFY_APP_URL: https://example.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Prepare database
        run: |
          npx prisma migrate deploy
          npm run db:index

      - name: Unit tests
        run: npm test

      - name: Integration tests (real engine, real Postgres)
        run: npm run test:integration

      - name: Edge-case suite
        run: npm run test:edge

      - name: Build
        run: npm run build
